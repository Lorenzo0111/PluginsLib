plugins {
    id 'java'
    id 'maven-publish'
    id "com.gradleup.shadow" version "8.3.6"
}

version "2.0.5"
description "Library for minecraft plugins"

ext {
    base = 'me.lorenzo0111.pluginslib.libraries'
}

shadowJar {
    archiveFileName = "${project.name}-${project.version}.jar"
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "maven-publish"

    group 'me.lorenzo0111.pluginslib'
    version '2.0.5'

    repositories {
        mavenCentral()
    }

    javadoc {
        options.links(
                'https://javadoc.io/static/org.jetbrains/annotations/26.1.0/',
                'https://docs.oracle.com/javase/8/docs/api/',
                'https://jd.papermc.io/paper/1.21.11/'
        )
        source = sourceSets.main.allJava
    }

    java {
        withJavadocJar()
        withSourcesJar()
    }

    repositories {
        maven { url = uri("https://dl.lorenzo0111.me/releases") }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.1.0'
        api 'me.lorenzo0111:slimjar:1.3.0'
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = 'PluginsLib'
                    description = 'A library for minecraft plugins'
                    url = 'https://github.com/Lorenzo0111/PluginsLib'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/Lorenzo0111/PluginsLib/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'lorenzo0111'
                            name = 'Lorenzo0111'
                            email = 'hello@lorenzo0111.me'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/Lorenzo0111/PluginsLib.git'
                        developerConnection = 'scm:git:ssh://github.com/Lorenzo0111/PluginsLib.git'
                        url = 'https://github.com/Lorenzo0111/PluginsLib'
                    }
                }

            }
        }

        repositories {
            maven {
                url 'https://dl.lorenzo0111.me/releases'
                credentials {
                    username = project.findProperty("repoUsername")
                    password = project.findProperty("repoPassword")
                }
            }
        }
    }
}
